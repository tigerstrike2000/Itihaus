<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Economic History Game - OpenFront Style</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Main game container -->
        <div id="game-container" class="game-container">
            <!-- Header -->
            <header class="header">
                <h1>⚔️ Economic Empires - Real-Time Strategy</h1>
                <div class="game-controls">
                    <button id="pause-btn" class="btn">Pause</button>
                </div>
            </header>

            <!-- Main content -->
            <main class="main-content">
                <!-- Sidebar: Empire info -->
                <aside class="sidebar">
                    <div class="empire-info">
                        <h2 id="empire-name">Empire</h2>
                        <div class="empire-stats">
                            <div class="stat">
                                <label>Population:</label>
                                <span id="population">0</span>
                            </div>
                            <div class="stat">
                                <label>Treasury:</label>
                                <span id="treasury">0</span>
                            </div>
                            <div class="stat">
                                <label>Happiness:</label>
                                <span id="happiness">50</span>%
                            </div>
                            <div class="stat">
                                <label>Selected Units:</label>
                                <span id="selected-units">0</span>
                            </div>
                        </div>
                    </div>

                    <!-- Resources -->
                    <div class="resources-panel">
                        <h3>Resources</h3>
                        <div id="resources-list" class="resources-list"></div>
                    </div>

                    <!-- Market -->
                    <div class="market-panel">
                        <h3>Market</h3>
                        <div id="prices-list" class="prices-list"></div>
                    </div>

                    <!-- Production -->
                    <div class="production-panel">
                        <h3>Production</h3>
                        <div id="production-list" class="production-list"></div>
                    </div>
                </aside>

                <!-- Main game area -->
                <section class="game-board" id="game-board">
                    <div id="game-view" class="game-view"></div>
                    <div class="action-bar">
                        <button id="expand-btn" class="action-btn">📍 Expand Territory</button>
                        <button id="units-btn" class="action-btn">🎖️ Produce Units</button>
                        <button id="attack-btn" class="action-btn">⚔️ Attack (Right-Click)</button>
                        <button id="trade-btn" class="action-btn">💰 Trade</button>
                    </div>
                </section>
            </main>

            <!-- Footer -->
            <footer class="footer">
                <div class="game-speed">
                    <label>Speed:</label>
                    <input type="range" id="speed-slider" min="0.5" max="3" step="0.5" value="1">
                    <span id="speed-display">1x</span>
                </div>
                <div class="game-stats-footer">
                    <span>Year: <span id="year">1</span></span>
                </div>
            </footer>
        </div>

        <!-- Start menu -->
        <div id="start-menu" class="modal">
            <div class="modal-content">
                <h2>Choose Your Civilization</h2>
                <p class="modal-subtitle">Build your empire, conquer territories, and dominate the world through economics and military power.</p>
                <div id="civilization-list" class="civilization-list"></div>
            </div>
        </div>

        <!-- Trading Modal -->
        <div id="trading-modal" class="modal hidden">
            <div class="modal-content trading-content">
                <div class="modal-header">
                    <h2>Trading Post</h2>
                    <button class="close-btn" onclick="closeTradingModal()">&times;</button>
                </div>
                <div class="trading-interface">
                    <div class="trade-section">
                        <h3>Sell</h3>
                        <select id="sell-resource" class="trade-select"></select>
                        <input type="number" id="sell-amount" placeholder="Amount" min="0">
                        <button class="action-btn" onclick="executeTrade()">Trade</button>
                    </div>
                    <div class="trade-section">
                        <h3>Result</h3>
                        <span id="trade-result"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/resources.js"></script>
    <script src="js/economy.js"></script>
    <script src="js/map.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
